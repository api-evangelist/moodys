      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
          text/json:
            schema:
              type: array
              items:
                type: string
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                type: string
        description: 'An array of series and/or expression.

          Series should be formatted as [location].[scenario-alias].[variable id].

          Examples:

          l.bl.fet_us --&gt; local data for the bl scenario

          c.bl.fet_us --&gt; central data for the bl scenario

          bl.fet_us --&gt; central data for the bl scenario

          ["l.bl.fet_us, "c.bl.fet_us", "l.bl.fet_us-c.bl.fet_us"] --&gt; local bl data, central bl data, expression containing both central and local data'
        required: true
  /project/{projectId}/scenario/{scenarioId}/data-series/{variableId}/data/local:
    put:
      tags:
      - DataSeries
      summary: Saves local series data
      operationId: DataSeries_SaveLocalSeriesDataAsync
      parameters:
      - name: scenarioId
        in: path
        description: The scenario Id.
        required: true
        schema:
          type: string
      - name: variableId
        in: path
        description: The variable Id.
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesSave'
          text/json:
            schema:
              $ref: '#/components/schemas/SeriesSave'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SeriesSave'
        description: The series save payload (can be entire series, or just deltas)
        required: true
  /project/{projectId}/scenario/{scenarioId}/data-series/add-factor/local:
    put:
      tags:
      - DataSeries
      summary: Clears add factors on series in which you have claimed
      operationId: DataSeries_ClearLocalAddFactorsAsync
      parameters:
      - name: projectId
        in: path
        description: The project Id.
        required: true
        schema:
          type: string
      - name: scenarioId
        in: path
        description: The scenario Id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
          text/json:
            schema:
              type: array
              items:
                type: string
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                type: string
        description: The list of series.
        required: true
components:
  schemas:
    SeriesSave:
      type: object
      properties:
        mnemonic:
          pattern: ^[A-Za-z][\w$]{0,64}$
          type: string
        transformation:
          format: int32
          type: integer
        customSeries:
          type: boolean
        isHistoryEditable:
          type: boolean
        historyModified:
          type: boolean
        freq:
          format: int32
          type: integer
        isModified:
          type: boolean
        startDate:
          format: int32
          type: integer
        endDate:
          format: int32
          type: integer
        lastHistorical:
          format: int32
          type: integer
        data:
          type: array
          items:
            format: double
            type: number
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: https://api.economy.com/scenario-studio/v2/oauth2/token
      description: OAuth2 Client Credentials
