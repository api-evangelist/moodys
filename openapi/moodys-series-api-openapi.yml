        required: true
        schema:
          type: string
      - name: variableId
        in: path
        description: The variable to sharedown.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
      security:
      - oauth2: []
    servers:
    - url: https://api.economy.com/scenario-studio/v2
  /project/{projectId}/scenario/{scenarioId}/series/checkin:
    post:
      tags:
      - Series
      summary: Releases a series/unlocks a series without writing data to central.
      operationId: Series_CheckIn
      parameters:
      - name: projectId
        in: path
        description: The Id of the project.
        required: true
        schema:
          type: string
      - name: scenarioId
        in: path
        description: The Id of the scenario.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
          text/json:
            schema:
              type: array
              items:
                type: string
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                type: string
        description: The list of variables to push.
        required: true
    servers:
    - url: https://api.economy.com/scenario-studio/v2
  /project/{projectId}/scenario/{scenarioId}/series/checkout:
    post:
      tags:
      - Series
      summary: Claim/check out series
      operationId: Series_CheckOut
      parameters:
      - name: projectId
        in: path
        description: The Id of the project.
        required: true
        schema:
          type: string
      - name: scenarioId
        in: path
        description: The Id of the scenario.
        required: true
        schema:
          type: string
      - name: exogenize
        in: query
        description: When true, sets series to be exogenous; else series default to the current central state.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
          text/json:
            schema:
              type: array
              items:
                type: string
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                type: string
        description: The list of variables to claim.
        required: true
    servers:
    - url: https://api.economy.com/scenario-studio/v2
  /project/{projectId}/scenario/{scenarioId}/series/commit:
    post:
      tags:
