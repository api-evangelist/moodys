      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitPayload'
          text/json:
            schema:
              $ref: '#/components/schemas/CommitPayload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommitPayload'
        description: The list of series to push, and a note describing the changes.
        required: true
    servers:
    - url: https://api.economy.com/scenario-studio/v2
